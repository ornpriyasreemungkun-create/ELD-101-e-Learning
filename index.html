                <button onclick="router.navigateTo('lesson2')" class="nav-item w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-left text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" data-page="lesson2">

                <button onclick="router.navigateTo('lesson3')" class="nav-item w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-left text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" data-page="lesson3">

            <!-- Reset Progress Button (Requires 2 clicks confirmation) -->

    <!-- Global Notification / Message Box Modal -->
    <div id="message-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 hidden" role="dialog" aria-modal="true">
        <div class="bg-[var(--bg-card)] border border-[var(--border-color)] p-6 rounded-xl shadow-xl max-w-sm w-full mx-4 space-y-4">
            <h3 id="modal-title" class="font-heading font-bold text-lg text-brand-600">แจ้งเตือน</h3>

            </div>
        </div>

    <script>
        // Course State Management with safe localStorage wrapper
        const STORAGE_KEY = 'eld101_course_data_v1';
        
        let state = {
            nickname: '',
            currentSubPage: { lesson1: 0, lesson2: 0, lesson3: 0, lesson4: 0 },
            completedPages: {},
            pretestAnswers: {},
            posttestAnswers: {},
            pretestScore: null,
            posttestScore: null,
            lessonChecks: { lesson1: {}, lesson2: {}, lesson3: {}, lesson4: {} },
            activitiesCompleted: { lesson1: false, lesson2: false, lesson3: false, lesson4: false },
            currentPage: 'home'
        };

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.warn('localStorage is unavailable:', e);
            }
        }

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    state = JSON.parse(saved);
                }
            } catch (e) {
                console.warn('Failed to load from localStorage:', e);
            }
        }

        function showMessage(title, message) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('message-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('message-modal').classList.add('hidden');
        }

        // Theme management
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');

        function setTheme(isDark) {
            if (isDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeIcon.innerText = '☀️';
            } else {
                document.documentElement.removeAttribute('data-theme');
                themeIcon.innerText = '🌙';
            }
        }

        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            setTheme(!isDark);
            try {
                localStorage.setItem('eld101_theme', !isDark ? 'dark' : 'light');
            } catch(e){}
        });

        // Initialize Theme preference
        try {
            const savedTheme = localStorage.getItem('eld101_theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                setTheme(true);
            }
        } catch(e) {}

        // Question Bank for Pre-test and Post-test (Randomized options order mechanism supported)
        const questionBank = [
            {
                id: 1,
                lesson: 1,
                question: "ข้อใดคือความหมายที่ถูกต้องที่สุดของ e-Learning ตามหลักวิชาการเทคโนโลยีการศึกษา?",
                options: [
                    "การเรียนรู้ผ่านเทคโนโลยีเว็บและการส่งผ่านเนื้อหาดิจิทัลเพื่อสนับสนุนการเรียนรู้ทุกที่ทุกเวลา",
                    "การใช้อินเทอร์เน็ตเพื่อเล่นเกมการศึกษาในห้องเรียน",
                    "การพิมพ์เอกสาร PDF แจกนักศึกษาทางอีเมล",
                    "การสอนผ่านโปรแกรมวิดีโอคอลโดยไม่มีเอกสารประกอบ"
                ],
                answer: 0,
                explanation: "e-Learning คือการเรียนรู้ผ่านเทคโนโลยีเว็บและสื่อดิจิทัลเพื่อส่งเสริมการเรียนรู้ได้ทุกเวลา (Ally, 2004)"
            },
            {
                id: 2,
                lesson: 1,
                question: "ในกระบวนการออกแบบระบบการสอน ADDIE ขั้นตอนใดทำหน้าที่กำหนดกลยุทธ์การสอนและสร้างต้นแบบสื่อ?",
                options: [
                    "Analysis (การวิเคราะห์)",
                    "Design (การออกแบบ)",
                    "Development (การพัฒนา)",
                    "Implementation (การนำไปใช้)"
                ],
                answer: 1,
                explanation: "ขั้น Design (การออกแบบ) มุ่งเน้นการกำหนดกลยุทธ์การสอน โครงสร้าง และการสร้างต้นแบบ (Branch, 2009)"
            },
            {
                id: 3,
                lesson: 2,
                question: "ตามแนวคิดของ Anderson & Krathwohl (2001) พฤติกรรมการเรียนรู้ระดับ 'การวิเคราะห์ (Analyze)' ตรงกับข้อใด?",
                options: [
                    "การท่องจำคำศัพท์สำคัญ",
                    "การจำแนกส่วนประกอบและความสัมพันธ์ของข้อมูล",
                    "การสร้างชิ้นงานใหม่ด้วยความคิดสร้างสรรค์",
                    "การบอกความหมายของทฤษฎี"
                ],
                answer: 1,
                explanation: "การวิเคราะห์ (Analyze) คือความสามารถในการแยกแยะข้อมูลออกเป็นส่วนย่อยและหาความสัมพันธ์ระหว่างกัน"
            },
            {
                id: 4,
                lesson: 2,
                question: "เหตุการณ์การสอน (Events of Instruction) ข้อใดของ Gagné ที่ควรทำเป็นอันดับแรกสุดเพื่อดึงดูดความสนใจของผู้เรียน?",
                options: [
                    "แจ้งวัตถุประสงค์การเรียนรู้",
                    "กระตุ้นการระลึกถึงความรู้เดิม",
                    "เร้าความสนใจ (Gain attention)",
                    "ให้ข้อมูลย้อนกลับ"
                ],
                answer: 2,
                explanation: "เหตุการณ์แรกตาม Gagné คือ การเร้าความสนใจ (Gaining attention) เพื่อเตรียมความพร้อมของผู้เรียน"
            },
            {
                id: 5,
                lesson: 3,
                question: "ตามหลักการออกแบบมัลติมีเดียของ Mayer หลักการ 'Coherence (ความสอดคล้อง)' แนะนำให้ปฏิบัติอย่างไร?",
                options: [
                    "ใส่เสียงเพลงบรรเลงประกอบตลอดเวลาเพื่อความสนุก",
                    "ตัดภาพหรือเสียงที่ไม่จำเป็นออกเพื่อไม่ให้รบกวนการเรียนรู้",
                    "ใช้ลูกศรชี้ตำแหน่งสำคัญบนหน้าจอ",
                    "แสดงข้อความและเสียงบรรยายพร้อมกัน"
                ],
                answer: 1,
                explanation: "หลัก Coherence ระบุว่าควรตัดสิ่งเร้าที่ไม่เกี่ยวข้อง (ภาพ/เสียงส่วนเกิน) ออก เพื่อลดภาระการรับรู้ (Mayer, 2009)"
            },
            {
                id: 6,
                lesson: 3,
                question: "ปฏิสัมพันธ์ประเภทใดตามกรอบของ Moore (1989) ที่เกิดจากการโต้ตอบระหว่างผู้เรียนกับระบบคอมพิวเตอร์หรือบทเรียนอัจฉริยะ?",
                options: [
                    "Learner-Content Interaction",
                    "Learner-Instructor Interaction",
                    "Learner-Interface Interaction",
                    "Learner-Learner Interaction"
                ],
                answer: 2,
                explanation: "Learner-Interface Interaction คือการปฏิสัมพันธ์ระหว่างผู้เรียนกับเครื่องมือหรือส่วนต่อประสานระบบ (Hillman et al., 1994)"
            },
            {
                id: 7,
                lesson: 4,
                question: "สูตร Normalized Gain ของ Hake (1998) มีประโยชน์สำคัญอย่างไรในการประเมินผลสัมฤทธิ์ทางการเรียน?",
                options: [
                    "วัดความพึงพอใจของผู้เรียนหลังเรียนจบ",
                    "วัดสัดส่วนความก้าวหน้าที่แท้จริงโดยขจัดผลกระทบจากคะแนนก่อนเรียน",
                    "คำนวณเวลาที่ใช้ในการเรียนออนไลน์",
                    "ตรวจสอบความถูกต้องของข้อสอบก่อนเรียน"
                ],
                answer: 1,
                explanation: "Normalized Gain วัดอัตราส่วนของคะแนนที่เพิ่มขึ้นจริงเทียบกับคะแนนที่สามารถเพิ่มได้สูงสุดที่เป็นไปได้ (Hake, 1998)"
            },
            {
                id: 8,
                lesson: 4,
                question: "ในมาตรฐานการเก็บข้อมูลการเรียนรู้ xAPI โครงสร้างข้อมูลพื้นฐานประกอบด้วยองค์ประกอบใดบ้าง?",
                options: [
                    "Question - Answer - Score",
                    "Actor - Verb - Object",
                    "Teacher - Student - Lesson",
                    "Input - Process - Output"
                ],
                answer: 1,
                explanation: "xAPI ใช้โครงสร้างประโยค Statement สามส่วนหลักคือ Actor (ผู้กระทำ) - Verb (กริยา) - Object (เป้าหมาย)"
            }
        ];

        // Router System
        const router = {
            navigateTo(pageId) {
                state.currentPage = pageId;
                saveState();
                render();
                updateSidebarActive();
                // Scroll main content to top
                const mainEl = document.getElementById('main-content');
                if (mainEl) mainEl.scrollTop = 0;
            }
        };

        function updateSidebarActive() {

                if (p === 'posttest' && state.posttestScore !== null) isDone = true;
                if (p === 'summary' && state.posttestScore !== null) isDone = true;

                const btn = document.querySelector(`[data-page="${p}"] .status-icon`);

        function renderTestPage(type) {

            const desc = isPre

            const isSubmitted = isPre ? (state.pretestScore !== null) : (state.posttestScore !== null);

            let html = `
                <div class="bg-[var(--bg-card)] border border-[var(--border-color)] p-6 md:p-8 rounded-2xl shadow-sm space-y-6">

                        <span class="inline-block bg-brand-100 dark:bg-brand-900/50 text-brand-700 dark:text-brand-300 px-3 py-1 rounded-full text-xs font-semibold">${isPre ? 'ประเมินก่อนเรียน' : 'ประเมินหลังเรียน'}</span>

                        <p class="text-[var(--text-muted)] text-sm">${desc}</p>
                    </div>
                    <div class="space-y-6 pt-4">
            `;

            questionBank.forEach((q, qIndex) => {
                // Generate consistent randomized order based on question ID and type
                // To keep it deterministic per session, we use a simple shuffle seeded by q.id
                const shuffledIndices = getShuffledIndices(q.id, q.options.length);
                const selectedOpt = currentAnswers[q.id];

                html += `
                    <div class="p-5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-main)] space-y-3">
                        <p class="font-heading font-medium text-sm text-[var(--text-main)]">ข้อที่ ${qIndex + 1}: ${q.question}</p>
                        <div class="space-y-2 pt-1" role="radiogroup" aria-label="คำถามข้อที่ ${qIndex + 1}">
                `;

                shuffledIndices.forEach((origIdx, optIdx) => {
                    const optText = q.options[origIdx];
                    const isChecked = selectedOpt === origIdx;
                    let optionStyle = "border-[var(--border-color)] hover:bg-slate-100 dark:hover:bg-slate-800";
                    
                    if (isSubmitted) {
                        if (origIdx === q.answer) {
                            optionStyle = "bg-emerald-100 dark:bg-emerald-950/50 border-emerald-500 text-emerald-900 dark:text-emerald-200 font-medium";
                        } else if (isChecked && origIdx !== q.answer) {
                            optionStyle = "bg-red-100 dark:bg-red-950/50 border-red-500 text-red-900 dark:text-red-200";
                        }
                    } else if (isChecked) {
                        optionStyle = "bg-brand-50 dark:bg-brand-950/50 border-brand-500 font-medium";
                    }

                    html += `
                        <label class="flex items-center space-x-3 p-3 rounded-lg border ${optionStyle} cursor-pointer transition-colors text-sm">
                            <input type="radio" name="q_${isPre ? 'pre' : 'post'}_${q.id}" value="${origIdx}" ${isChecked ? 'checked' : ''} ${isSubmitted ? 'disabled' : ''} onchange="handleAnswerSelect('${type}', ${q.id}, ${origIdx})" class="text-brand-600 focus:ring-brand-500">
                            <span>${optText}</span>
                        </label>
                    `;
                });

                html += `</div>`;
                if (isSubmitted) {
                    html += `
                        <div class="mt-3 p-3 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs text-[var(--text-muted)]">
                            💡 <strong class="text-[var(--text-main)]">เฉลย:</strong> ${q.explanation}
                        </div>
                    `;
                }
                html += `</div>`;
            });

            html += `
                    </div>
                    <div class="flex justify-end pt-4">

            if (!isSubmitted) {
                html += `<button onclick="submitTest('${type}')" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg text-sm transition-colors shadow-sm">ส่งคำตอบ ${isPre ? 'ก่อนเรียน' : 'หลังเรียน'}</button>`;
            } else {
                const score = isPre ? state.pretestScore : state.posttestScore;
                html += `
                    <div class="flex items-center justify-between w-full">
                        <span class="font-heading font-bold text-brand-700 dark:text-brand-300">คะแนนของคุณ: ${score} / 8 คะแนน</span>
                        <button onclick="router.navigateTo('${isPre ? 'lesson1' : 'summary'}')" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg text-sm transition-colors shadow-sm">

                `;
            }

            html += `</div></div>`;
            return html;
        }

        // Helper to shuffle options deterministically per question ID
        function getShuffledIndices(seed, length) {
            let indices = Array.from({length}, (_, i) => i);
            // Simple pseudo-random shuffle based on seed
            for (let i = length - 1; i > 0; i--) {
                let j = (seed * 37 + i * 19) % length;
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            return indices;
        }

        function handleAnswerSelect(type, qId, optIdx) {
            if (type === 'pre') {
                state.pretestAnswers[qId] = optIdx;

                state.posttestAnswers[qId] = optIdx;
            }
            saveState();

        function submitTest(type) {
            const isPre = type === 'pre';

            let score = 0;
            questionBank.forEach(q => {
                if (answers[q.id] === q.answer) {

            });

            } else {
                state.posttestScore = score;
            }
            saveState();
            render();
            updateProgressIndicators();
            showMessage('ส่งคำตอบสำเร็จ', `คุณทำคะแนนได้ ${score} จาก 8 คะแนน`);
        }

                            </div>

                            <div class="p-4 rounded-xl border border-[var(--border-color)] bg-[var(--bg-main)] space-y-2">
                                <p class="font-heading font-medium text-sm">2. หากต้องการประเมินว่าผู้เรียนนำความรู้ไปปฏิบัติจริงในห้องเรียน ตรงกับ Kirkpatrick ระดับใด?</p>
                                <div class="space-y-1.5">
                                    <label class="flex items-center space-x-2 text-sm cursor-pointer"><input type="radio" name="l4q2" value="0" onchange="checkLessonQuiz(4, 2, 0)"><span>ก. Level 1 (Reaction)</span></label>
                                    <label class="flex items-center space-x-2 text-sm cursor-pointer"><input type="radio" name="l4q2" value="1" onchange="checkLessonQuiz(4, 2, 1)"><span>ข. Level 2 (Learning)</span></label>
                                    <label class="flex items-center space-x-2 text-sm cursor-pointer"><input type="radio" name="l4q2" value="2" onchange="checkLessonQuiz(4, 2, 2)"><span>ค. Level 3 (Behavior)</span></label>
                                </div>
                                <div id="l4q2_fb" class="text-xs font-medium pt-1"></div>
                            </div>
                        </div>
                    </div>
                `;
            }

            return wrapLessonShell('lesson4', 'บทที่ 4: การวัดผลและข้อมูลการเรียนรู้', contentHtml, subPage, pagesTotal);
        }

        function checkKpActivity() {
            const val = document.getElementById('kp_match_1').value;
            const fb = document.getElementById('kp-feedback');

            if (val === '1') {
                fb.className = "text-sm font-medium text-emerald-600 dark:text-emerald-400";
                fb.innerText = "🎉 ถูกต้อง! แบบประเมินความพึงพอใจจัดอยู่ใน Level 1: Reaction ตามโมเดลของ Kirkpatrick";
                state.activitiesCompleted.lesson4 = true;
                saveState();
                updateProgressIndicators();
            } else {
                fb.className = "text-sm font-medium text-red-600 dark:text-red-400";
                fb.innerText = "❌ ยังไม่ถูกต้อง ความพึงพอใจสะท้อนปฏิกิริยาตอบสนองเบื้องต้นของผู้เรียน";
            }
        }

        function wrapLessonShell(lessonKey, lessonTitle, contentHtml, subPage, pagesTotal) {
            return `
                <div class="bg-[var(--bg-card)] border border-[var(--border-color)] p-6 md:p-8 rounded-2xl shadow-sm space-y-6">
                    <div class="border-b border-[var(--border-color)] pb-4 flex items-center justify-between">
                        <span class="text-xs font-bold text-brand-600 uppercase tracking-wider font-heading">${lessonTitle}</span>
                        <span class="text-xs text-[var(--text-muted)]">หน้า ${subPage + 1} / ${pagesTotal}</span>
                    </div>

                    ${contentHtml}

                    <div class="flex items-center justify-between pt-6 border-t border-[var(--border-color)]">
                        <button onclick="changeLessonPage('${lessonKey}', -1)" ${subPage === 0 ? 'disabled' : ''} class="px-4 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-lg text-sm font-medium disabled:opacity-40 transition-colors">
                            ⬅️ ก่อนหน้า
                        </button>
                        <button onclick="changeLessonPage('${lessonKey}', 1)" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition-colors shadow-sm">
                            ${subPage === pagesTotal - 1 ? 'จบบทเรียน ➔' : 'ถัดไป ➔'}
                        </button>
                    </div>
                </div>
            `;
        }

        function changeLessonPage(lessonKey, delta) {
            const current = state.currentSubPage[lessonKey] || 0;
            const next = current + delta;
            if (next >= 0 && next < 4) {
                state.currentSubPage[lessonKey] = next;
                saveState();
                render();
            } else if (next >= 4) {
                // Advance to next lesson or posttest
                if (lessonKey === 'lesson1') router.navigateTo('lesson2');
                else if (lessonKey === 'lesson2') router.navigateTo('lesson3');
                else if (lessonKey === 'lesson3') router.navigateTo('lesson4');
                else if (lessonKey === 'lesson4') router.navigateTo('posttest');
            }
        }

        // Inline quick quiz checking logic for lessons
        function checkLessonQuiz(lessonNum, qNum, selectedVal) {
            // Correct answers mapping
            const answersMap = {
                1: { 1: 1, 2: 1 },
                2: { 1: 1, 2: 2 },
                3: { 1: 1, 2: 0 },
                4: { 1: 1, 2: 2 }
            };

            const isCorrect = answersMap[lessonNum][qNum] === selectedVal;
            const fbEl = document.getElementById(`l${lessonNum}q${qNum}_fb`);
            if (fbEl) {
                if (isCorrect) {
                    fbEl.className = "text-xs font-medium text-emerald-600 dark:text-emerald-400";
                    fbEl.innerText = "✅ ถูกต้องครับ!";
                } else {
                    fbEl.className = "text-xs font-medium text-red-600 dark:text-red-400";
                    fbEl.innerText = "❌ ยังไม่ถูกต้อง ลองทบทวนเนื้อหาในบทเรียนอีกครั้ง";
                }
            }
        }

        function renderSummary() {
            const pre = state.pretestScore !== null ? state.pretestScore : 0;
            const post = state.posttestScore !== null ? state.posttestScore : 0;
            const total = 8;

            // Normalized Gain Calculation: (post - pre) / (total - pre)
            let gain = 0;
            let denominator = total - pre;
            if (denominator > 0) {
                gain = (post - pre) / denominator;
            } else if (denominator === 0 && post === total) {
                gain = 1.0; // Perfect score from pre-test
            }

            // Handle negative gain if post < pre
            let gainDisplay = gain.toFixed(2);
            let interpretation = "";
            let limitationNote = "หมายเหตุ: แบบทดสอบนี้มีจำนวนข้อจำกัด (8 ข้อ) ผลการประเมินรายบุคคลนี้จึงควรใช้เป็นแนวทางพัฒนาตนเองเบื้องต้นเท่านั้น";

            if (denominator === 0 && pre === total) {
                interpretation = "ผู้เรียนทำคะแนนก่อนเรียนเต็มอยู่แล้ว (Ceiling Effect) ความก้าวหน้าสูงสุด";
            } else if (gain >= 0.7) {
                interpretation = "ความก้าวหน้าสูงมาก (High Gain) ตามเกณฑ์ของ Hake (g ≥ 0.7)";
            } else if (gain >= 0.3) {
                interpretation = "ความก้าวหน้าปานกลาง (Medium Gain) ตามเกณฑ์ของ Hake (0.3 ≤ g < 0.7)";
            } else if (gain > 0) {
                interpretation = "ความก้าวหน้าต่ำ (Low Gain) ตามเกณฑ์ของ Hake (g < 0.3)";
            } else {
                interpretation = "คะแนนหลังเรียนเท่ากับหรือน้อยกว่าก่อนเรียน (Non-positive gain) อาจเกิดจากความล้าในการทำแบบทดสอบหรือการเดาในรอบแรก";
                if (gain < 0) gainDisplay = gain.toFixed(2);
            }

            // Completed lessons count
            let completedLessonsCount = Object.values(state.activitiesCompleted).filter(Boolean).length;

            return `
                <div class="bg-[var(--bg-card)] border border-[var(--border-color)] p-6 md:p-8 rounded-2xl shadow-sm space-y-6">
                    <div class="space-y-1">
                        <span class="inline-block bg-brand-100 dark:bg-brand-900/50 text-brand-700 dark:text-brand-300 px-3 py-1 rounded-full text-xs font-semibold">สรุปผลการเรียนรู้</span>
                        <h2 class="font-heading font-bold text-2xl text-brand-800 dark:text-brand-400">รายงานผลสัมฤทธิ์ทางการเรียน</h2>
                        <p class="text-[var(--text-muted)] text-sm">ผู้เรียน: <strong class="text-[var(--text-main)]">${state.nickname || 'ผู้เรียนทั่วไป'}</strong></p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="p-4 rounded-xl border border-[var(--border-color)] bg-[var(--bg-main)] text-center space-y-1">
                            <span class="text-xs text-[var(--text-muted)]">คะแนนก่อนเรียน (Pre-Test)</span>
                            <div class="font-heading font-bold text-2xl text-slate-700 dark:text-slate-200">${state.pretestScore !== null ? state.pretestScore : 'ยังไม่ทำ'} / 8</div>
                        </div>
                        <div class="p-4 rounded-xl border border-[var(--border-color)] bg-[var(--bg-main)] text-center space-y-1">
                            <span class="text-xs text-[var(--text-muted)]">คะแนนหลังเรียน (Post-Test)</span>
                            <div class="font-heading font-bold text-2xl text-brand-600">${state.posttestScore !== null ? state.posttestScore : 'ยังไม่ทำ'} / 8</div>
                        </div>
                        <div class="p-4 rounded-xl border border-[var(--border-color)] bg-[var(--bg-main)] text-center space-y-1">
                            <span class="text-xs text-[var(--text-muted)]">Normalized Gain (<math>g</math>)</span>
                            <div class="font-heading font-bold text-2xl text-emerald-600 dark:text-emerald-400">${gainDisplay}</div>
                        </div>
                    </div>

                    <div class="p-4 rounded-xl border border-[var(--border-color)] bg-[var(--bg-main)] space-y-2 text-sm">
                        <h3 class="font-heading font-bold text-brand-600">📊 การตีความผลลัพธ์และข้อจำกัด</h3>
                        <p><strong>การตีความ Gain:</strong> ${interpretation}</p>
                        <p><strong>บทเรียนที่ทำกิจกรรมสำเร็จ:</strong> ${completedLessonsCount} / 4 บท</p>
                        <p class="text-xs text-[var(--text-muted)] pt-1 border-t border-[var(--border-color)]">${limitationNote}</p>
                    </div>

                    <div class="flex justify-between pt-4">
                        <button onclick="router.navigateTo('posttest')" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 rounded-lg text-sm font-medium hover:bg-slate-300">⬅️ กลับไปแบบทดสอบหลังเรียน</button>
                        <button onclick="window.print()" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium shadow-sm">🖨️ พิมพ์/บันทึกรายงานผล</button>
                    </div>
                </div>
            `;
        }

        function render() {
            const container = document.getElementById('page-container');
            if (!container) return;

            if (state.currentPage === 'home') {
                container.innerHTML = renderHome();
            } else if (state.currentPage === 'pretest') {
                container.innerHTML = renderTestPage('pre');
            } else if (state.currentPage === 'lesson1') {
                container.innerHTML = renderLesson1();
                renderAddieList();
            } else if (state.currentPage === 'lesson2') {
                container.innerHTML = renderLesson2();
            } else if (state.currentPage === 'lesson3') {
                container.innerHTML = renderLesson3();
            } else if (state.currentPage === 'lesson4') {
                container.innerHTML = renderLesson4();
            } else if (state.currentPage === 'posttest') {
                container.innerHTML = renderTestPage('post');
            } else if (state.currentPage === 'summary') {
                container.innerHTML = renderSummary();
            }

            updateSidebarActive();
        }

        // Mobile Sidebar Drawer Toggle
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const closeSidebarBtn = document.getElementById('close-sidebar');
        const sidebar = document.getElementById('sidebar');

        mobileMenuBtn.addEventListener('click', () => {
            sidebar.classList.remove('-translate-x-full');
        });

        closeSidebarBtn.addEventListener('click', () => {
            sidebar.classList.add('-translate-x-full');
        });

        // Initialize App on Window Load
        window.onload = function() {
            loadState();
            if (state.nickname) {
                document.getElementById('header-nickname').innerText = state.nickname;
                document.getElementById('user-display').classList.remove('hidden');
            }
            render();
        };
    </script>
</body>
</html>
